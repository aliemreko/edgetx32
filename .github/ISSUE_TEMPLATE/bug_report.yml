name: Bug report
description: Something does not work on ESP32-S3 / EdgeTX32
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please confirm this is EdgeTX32 (ESP32), not upstream STM32 EdgeTX.
  - type: textarea
    id: hw
    attributes:
      label: Hardware
      description: ESP32-S3 module, display, ELRS wiring, IDF version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
