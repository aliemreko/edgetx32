---
name: Build ESP32 firmware
on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    tags:
      - v*
    paths: &trigger-paths
      - '.github/workflows/build_fw.yml'
      - 'cmake/**'
      - 'radio/**'
      - 'platforms/esp32/**'
      - 'tools/esp32/**'
      - 'tools/build-gh.sh'
      - 'CMakeLists.txt'
      - 'requirements.txt'
  pull_request:
    paths: *trigger-paths

jobs:
  verify-hw:
    name: Verify ESP32 hardware generators
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'ci: skip-fw')
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run hw_defs self-check
        run: ./tools/esp32/verify_hw_gen.sh

  build:
    name: Build ESP32-S3 firmware
    needs: verify-hw
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'ci: skip-fw')
    container: espressif/idf:v5.2.3
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/edgetx32/edgetx32 || true
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ./tools/esp32/build.sh

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short HEAD)"
          OUT_BIN="edgetx32-esp32s3-${SHA_SHORT}.bin"
          cp platforms/esp32/build/edgetx-esp32s3.bin "${OUT_BIN}"
          ls -la "${OUT_BIN}"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32s3
          path: |
            fw.json
            LICENSE
            NOTICE
            edgetx32-esp32s3-*.bin
          retention-days: 15
          if-no-files-found: error

  package:
    name: Package firmwares
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compose release filename
        run: echo "artifact_name=edgetx32-firmware-${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - name: Merge firmware artifact packages
        uses: actions/upload-artifact/merge@v7
        with:
          name: "${{ env.artifact_name }}"
          pattern: firmware-*
          delete-merged: true
          retention-days: 15
