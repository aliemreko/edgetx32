---
name: Build and deploy nightly release
on:
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly.yml'
      - 'tools/esp32/**'
      - 'platforms/esp32/**'
      - 'radio/src/targets/esp32s3/**'
      - 'radio/src/boards/hw_defs/esp32s3.json'

concurrency:
  group: 'nightly'
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.3
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Build EdgeTX32 (ESP32-S3)
        env:
          EDGETX_VERSION_SUFFIX: nightly
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ./tools/esp32/build.sh

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short HEAD)"
          OUT_BIN="edgetx32-esp32s3-${SHA_SHORT}-nightly.bin"
          SRC_BIN="platforms/esp32/build/edgetx-esp32s3.bin"
          test -f "${SRC_BIN}"
          cp "${SRC_BIN}" "${OUT_BIN}"
          # Optional extras when present
          for f in \
            platforms/esp32/build/bootloader/bootloader.bin \
            platforms/esp32/build/partition_table/partition-table.bin \
            platforms/esp32/build/ota_data_initial.bin
          do
            if [[ -f "$f" ]]; then
              cp "$f" "./$(basename "$f")"
            fi
          done
          ls -la "${OUT_BIN}" *.bin
          echo "artifact_bin=${OUT_BIN}" >> "${GITHUB_ENV}"

      - name: Package firmware
        uses: actions/upload-artifact@v7
        with:
          name: edgetx32-firmware-nightly-esp32s3
          path: |
            fw.json
            LICENSE
            NOTICE
            README.md
            edgetx32-esp32s3-*-nightly.bin
            bootloader.bin
            partition-table.bin
            ota_data_initial.bin
          retention-days: 15
          if-no-files-found: error

  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: edgetx32-firmware-nightly-*
          path: edgetx32-firmware-nightly
          merge-multiple: true

      - name: Compose release metadata
        run: |
          set -euo pipefail
          echo "release_filename=edgetx32-firmware-nightly-${GITHUB_SHA::8}.zip" >> "$GITHUB_ENV"
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          if git rev-parse nightly >/dev/null 2>&1; then
            echo "old_nightly_sha=$(git rev-parse nightly)" >> "$GITHUB_ENV"
            echo "cliff_range=nightly..HEAD" >> "$GITHUB_ENV"
          else
            echo "old_nightly_sha=${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "cliff_range=HEAD~1..HEAD" >> "$GITHUB_ENV"
          fi

      - name: Zip release file
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -j -r ${{ env.release_filename }} ./edgetx32-firmware-nightly

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --strip all ${{ env.cliff_range }}
        env:
          OUTPUT: CHANGELOG.md
        continue-on-error: true

      - name: Update nightly tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f nightly
          git push -f origin nightly

      - name: Delete previous nightly release
        run: |
          gh release delete nightly --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          name: "EdgeTX32 Nightly (ESP32-S3)"
          body: |
            ## Automated Nightly Build — EdgeTX32

            **Target:** ESP32-S3
            **Commit:** ${{ github.sha }}
            **Built:** ${{ env.build_date }}

            This is an automated nightly build of the EdgeTX32 ESP32-S3 fork. Builds are for testing and may contain bugs.

            ### Flash
            1. Download `${{ env.release_filename }}` and extract it
            2. Flash with ESP-IDF / esptool, for example:
               ```bash
               esptool.py -p /dev/ttyACM0 write_flash 0x10000 edgetx32-esp32s3-*-nightly.bin
               ```
               Or from a full IDF tree: `idf.py -p /dev/ttyACM0 flash`

            See [docs/esp32/BUILD.md](https://github.com/${{ github.repository }}/blob/main/docs/esp32/BUILD.md) for details.

            ## Changes since last nightly build

            ${{ steps.changelog.outputs.content }}

            ---
            **Full Diff:** https://github.com/${{ github.repository }}/compare/${{ env.old_nightly_sha }}...${{ github.sha }}
          files: |
            ${{ env.release_filename }}
